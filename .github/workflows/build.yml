name: Збірка APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Зібрати APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/prozorro-monitor-${{ github.run_number }}.apk

      - name: Зберегти як артефакт
        uses: actions/upload-artifact@v4
        with:
          name: prozorro-monitor-apk
          path: dist/*.apk

      # Кожна збірка публікується як реліз — APK зручно завантажити прямо з телефона.
      - name: Опублікувати реліз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Збірка ${{ github.run_number }}
          make_latest: true
          files: dist/*.apk
