<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Закупівлі Prozorro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="top-row">
      <div class="top-titles">
        <h1 id="screenTitle">Закупівлі</h1>
        <div id="buyerName" class="sub">КНП «Третя черкаська міська лікарня ШМД»</div>
      </div>
      <button id="refreshBtn" class="icon-btn" aria-label="Оновити">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
    </div>
    <div id="searchWrap" class="search">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input id="searchInput" type="search" placeholder="Пошук: назва, ДК 021, UA-…" autocomplete="off" enterkeyhint="search">
    </div>
  </header>

  <main id="views">
    <!-- Закупівлі -->
    <section id="view-list" class="view active">
      <div id="filters" class="filters">
        <div class="chips" id="groupChips"></div>
        <div class="chips" id="typeChips"></div>
      </div>
      <div id="listMeta" class="meta"></div>
      <div id="list" class="cards"></div>
      <div id="listMore"></div>
    </section>

    <!-- Відстежувані -->
    <section id="view-watched" class="view">
      <div id="watched" class="cards"></div>
    </section>

    <!-- Ризики -->
    <section id="view-risks" class="view">
      <div class="note">Індикатори ризиків Державної аудиторської служби (risks.prozorro.gov.ua) — автоматичні сигнали, а не встановлені порушення.</div>
      <div id="riskMeta" class="meta"></div>
      <div id="risks" class="cards"></div>
      <div id="riskMore"></div>
    </section>

    <!-- Налаштування -->
    <section id="view-settings" class="view">
      <div id="settings"></div>
    </section>
  </main>

  <nav id="tabs">
    <button data-tab="list" class="active">
      <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z"/></svg>
      <span>Закупівлі</span>
    </button>
    <button data-tab="watched">
      <svg viewBox="0 0 24 24"><path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
      <span>Відстежую</span>
    </button>
    <button data-tab="risks">
      <svg viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
      <span>Ризики</span>
    </button>
    <button data-tab="settings">
      <svg viewBox="0 0 24 24"><path d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54A.48.48 0 0 0 13.93 2h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.73 8.47a.48.48 0 0 0 .12.61l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.25.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/></svg>
      <span>Налаштування</span>
    </button>
  </nav>

  <!-- Картка закупівлі -->
  <section id="detail" class="detail" aria-hidden="true">
    <header class="detail-top">
      <button id="detailBack" class="icon-btn" aria-label="Назад">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <div id="detailId" class="detail-id"></div>
      <button id="detailShare" class="icon-btn" aria-label="Поділитися">
        <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11A2.99 2.99 0 0 0 21 5a3 3 0 1 0-5.91.7L8.04 9.81A2.99 2.99 0 0 0 3 12a3 3 0 0 0 5.04 2.19l7.12 4.16c-.05.21-.08.43-.08.65A2.92 2.92 0 1 0 18 16.08z"/></svg>
      </button>
      <button id="detailStar" class="icon-btn star" aria-label="Відстежувати">
        <svg viewBox="0 0 24 24"><path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
      </button>
    </header>
    <div id="detailBody" class="detail-body"></div>
  </section>

  <div id="toast"></div>
</div>
<script src="app.js"></script>
</body>
</html>
